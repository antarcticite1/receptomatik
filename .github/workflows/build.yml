name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать project.zip в репозиторий
        id: unpack
        run: |
          if [ -f project.zip ]; then
            if unzip -l project.zip | grep -q "tools/prepare-assets.mjs"; then
              unzip -o -q project.zip -x '.github/*' -d .
              git rm -q project.zip
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -q -m "Исходный код приложения"
              git push
            else
              echo "::notice::Загрузите новый project.zip — сборка начнётся после этого."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ ! -f settings.gradle ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.unpack.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        if: steps.unpack.outputs.skip != 'true'
        with:
          node-version: 20

      - uses: gradle/actions/setup-gradle@v4
        if: steps.unpack.outputs.skip != 'true'

      - name: Скачать фото новых блюд и шрифты
        if: steps.unpack.outputs.skip != 'true'
        run: node tools/prepare-assets.mjs

      - name: Подготовить ключ подписи
        if: steps.unpack.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета KEYSTORE_BASE64. Добавьте его в Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks" || {
            echo "::error::Секрет KEYSTORE_BASE64 повреждён. Создайте его заново и вставьте текст целиком."
            exit 1
          }
          PASS="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" -alias app > /dev/null 2>&1; then
            echo "::error::Ключ не открывается: проверьте секреты KEYSTORE_BASE64 и KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Собрать APK
        if: steps.unpack.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION="$(sed -n 's/.*versionName "\(.*\)\${runNumber}".*/\1/p' app/build.gradle)${GITHUB_RUN_NUMBER}"
          APK="chto-prigotovit-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.unpack.outputs.skip != 'true'
        with:
          name: chto-prigotovit-apk
          path: |
            chto-prigotovit-v*.apk
            chto-prigotovit-v*.apk.sha256

      - name: Опубликовать в Releases
        if: steps.unpack.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "$APK" "$APK.sha256" \
            --title "chto-prigotovit" \
            --notes "Собрано из коммита ${{ github.sha }}. Журнал сборки: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --latest
